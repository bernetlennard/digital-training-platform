# Vite hängt an alle Dateien unter /assets einen Hash an, jeder Build gibt neue Namen.
# Sie dürfen darum ein Jahr im Cache bleiben. Alles andere, vor allem index.html,
# fragt der Browser jedes Mal neu an, damit nach einem Deployment die neue Version lädt.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/frontend;
    server_tokens off;

    add_header Cache-Control $cache_control;

    # Nur Ressourcen vom eigenen Server (#NFA-7.10). 'unsafe-inline' bei style-src braucht
    # MUI (Emotion schreibt die Styles zur Laufzeit), data: bei font-src, weil Vite kleine
    # Roboto-Dateien direkt ins CSS einbettet.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Ein fehlendes Bundle (z. B. alter Tab nach einem Deployment) gibt 404 statt index.html
    location /assets/ {
        try_files $uri =404;
    }

    # Web-App-Manifest mit dem richtigen Typ, auch wenn mime.types die Endung nicht kennt
    # (wegen nosniff verlässt sich der Browser nicht auf eine Vermutung)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # /anmelden, /registrieren usw. gibt es nur in der SPA: unbekannte Pfade liefern index.html,
    # React Router übernimmt im Browser. /api leitet Caddy vorher ans Backend weiter.
    location / {
        try_files $uri /index.html;
    }
}
