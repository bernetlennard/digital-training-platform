# Dateien unter /assets haben einen Hash im Namen, index.html muss immer neu geladen werden
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/frontend;
    server_tokens off;

    add_header Cache-Control $cache_control;

    # 'unsafe-inline' braucht MUI für die Styles zur Laufzeit, data: die eingebetteten Roboto-Schriften
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /assets/ {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
