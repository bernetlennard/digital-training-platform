# Produktiver Stack auf einem Host: Caddy, Frontend, Backend und PostgreSQL (#NFA-7.18).
# Werte und Secrets (DOMAIN, DB_PASSWORD, JWT_SECRET) kommen aus deploy/.env, nie aus dem Repository (#NFA-7.20).
# Frontend und Backend kommen als fertige Images von Docker Hub, hier wird nichts gebaut.
# IMAGE_TAG setzt der Deploy-Workflow auf den Commit-SHA, ohne ihn gilt latest.
name: trainingplatform

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Einziger Einstieg von aussen (#NFA-7.19): 80 leitet nur auf HTTPS um
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Zertifikate von Let's Encrypt, damit sie einen Neustart überleben
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [frontend, backend]

  frontend:
    image: bernetlennard/dtp-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [web]

  backend:
    image: bernetlennard/dtp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/digital_training_platform
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
    networks: [web, db]
    # Flyway braucht beim Start eine erreichbare Datenbank
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_training_platform
      # Gilt nur beim allerersten Start, wenn das Volume noch leer ist
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - db_data:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_training_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Caddy, Frontend und Backend
  web:
  # Nur Backend und Datenbank, ohne Verbindung nach aussen
  db:
    internal: true

volumes:
  db_data:
  caddy_data:
  caddy_config:
