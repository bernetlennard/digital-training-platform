spring.application.name=trainingplatform
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_training_platform
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# TODO: app.jwt.secret aus Umgebungsvariable setzen (mind. 256 Bit), z. B. app.jwt.secret=${JWT_SECRET}
